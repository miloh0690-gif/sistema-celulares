<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Préstamos y Consignaciones - Harvard Tech Mentor</title>
    <!-- Importamos Tailwind CSS desde una fuente pública y segura para darle un diseño ejecutivo -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen">

    <!-- CONTENEDOR PRINCIPAL -->
    <div class="max-w-6xl mx-auto px-4 py-8">
        
        <!-- ENCABEZADO PRINCIPAL -->
        <header class="mb-8 border-b border-gray-200 pb-4">
            <h1 class="text-3xl font-bold text-indigo-900">Módulo de Préstamos y Consignaciones</h1>
            <p class="text-gray-600 mt-1">Respaldo digital y control de activos para evitar pérdidas y olvidos.</p>
        </header>

        <!-- DISTRIBUCIÓN EN DOS COLUMNAS: FORMULARIO (IZQUIERDA) Y TABLA/RESPALDO (DERECHA) -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- COLUMNA 1: FORMULARIO DE REGISTRO (Ocupa 1 de 3 partes) -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 h-fit">
                <h2 class="text-xl font-semibold text-gray-700 mb-4 border-b pb-2">Registrar Nuevo Préstamo</h2>
                
                <form id="formPrestamo" class="space-y-4">
                    <!-- Campo: Cliente -->
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Nombre del Cliente / Responsable</label>
                        <input type="text" id="nombreCliente" required class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="Ej. Juan Pérez">
                    </div>

                    <!-- Campo: Equipo -->
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Equipo / Activo Prestado</label>
                        <input type="text" id="equipoPrestado" required class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="Ej. Laptop HP Nro. 3">
                    </div>

                    <!-- Campo: Monto -->
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Monto del Préstamo / Alquiler ($)</label>
                        <input type="number" id="montoPrestamo" required min="0" class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="0.00">
                    </div>

                    <!-- Campo: Estado de Pago -->
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Estado Financiero Inicial</label>
                        <select id="estadoPago" class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                            <option value="Pendiente">Pendiente de Pago</option>
                            <option value="Pagado">Pagado Totalmente</option>
                        </select>
                    </div>

                    <!-- Botón de Acción -->
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-lg transition duration-200 shadow-sm">
                        Guardar Registro de Respaldo
                    </button>
                </form>
            </div>

            <!-- COLUMNA 2 Y 3: TABLA DE RESPALDO Y CONTROL (Ocupa 2 de 3 partes) -->
            <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                <div class="flex justify-between items-center mb-4 border-b pb-2">
                    <h2 class="text-xl font-semibold text-gray-700">Bitácora de Préstamos Activos</h2>
                    <span id="contadorPrestamos" class="bg-indigo-100 text-indigo-800 text-xs font-semibold px-2.5 py-0.5 rounded-full">0 Registros</span>
                </div>

                <!-- TABLA RESPONSIVA -->
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left text-gray-500">
                        <thead class="text-xs text-gray-700 uppercase bg-gray-100">
                            <tr>
                                <th class="px-4 py-3">Fecha/Hora</th>
                                <th class="px-4 py-3">Cliente</th>
                                <th class="px-4 py-3">Equipo</th>
                                <th class="px-4 py-3">Monto</th>
                                <th class="px-4 py-3">Estado</th>
                                <th class="px-4 py-3 text-right">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaCuerpo">
                            <!-- Los registros agregados por el usuario aparecerán aquí dinámicamente -->
                        </tbody>
                    </table>
                </div>

                <!-- Mensaje de tabla vacía -->
                <div id="mensajeVacio" class="text-center py-8 text-gray-400">
                    No tienes préstamos registrados en este momento. ¡Excelente control!
                </div>
            </div>

        </div>
    </div>

    <!-- SCRIPT DE LÓGICA E INTELIGENCIA DEL SISTEMA -->
    <script>
        // Arreglo global para almacenar los préstamos en memoria
        let listaPrestamos = [];

        // Al cargar la página, recuperamos la información previamente guardada en el navegador
        document.addEventListener("DOMContentLoaded", () => {
            const datosGuardados = localStorage.getItem("prestamos_respaldo");
            if (datosGuardados) {
                listaPrestamos = JSON.parse(datosGuardados);
                actualizarTabla();
            }
        });

        // Capturamos el formulario para procesar el envío de datos
        const form = document.getElementById("formPrestamo");
        form.addEventListener("submit", (evento) => {
            evento.preventDefault(); // Evitamos que la página se recargue automáticamente

            // Capturamos los valores que el usuario escribió en la pantalla
            const cliente = document.getElementById("nombreCliente").value;
            const equipo = document.getElementById("equipoPrestado").value;
            const monto = document.getElementById("montoPrestamo").value;
            const estado = document.getElementById("estadoPago").value;
            
            // Generamos una marca de tiempo legible (Fecha y Hora actual)
            const ahora = new Date();
            const fechaFormateada = ahora.toLocaleDateString() + ' ' + ahora.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

            // Creamos el objeto de negocio para este préstamo específico
            const nuevoPrestamo = {
                id: Date.now(), // ID único basado en milisegundos para identificar este registro exacto
                fecha: fechaFormateada,
                cliente: cliente,
                equipo: equipo,
                monto: parseFloat(monto).toFixed(2),
                estado: estado
            };

            // Lo añadimos a nuestra lista, guardamos y actualizamos la interfaz de usuario
            listaPrestamos.push(nuevoPrestamo);
            guardarEnAlmacenamiento();
            actualizarTabla();

            // Limpiamos el formulario para el siguiente ingreso
            form.reset();
        });

        // Función encargada de persistir la información en el almacenamiento local del navegador (LocalStorage)
        function guardarEnAlmacenamiento() {
            localStorage.setItem("prestamos_respaldo", JSON.stringify(listaPrestamos));
        }

        // Función encargada de redibujar la tabla en pantalla con los datos actualizados
        function actualizarTabla() {
            const cuerpo = document.getElementById("tablaCuerpo");
            const mensajeVacio = document.getElementById("mensajeVacio");
            const contador = document.getElementById("contadorPrestamos");
            
            // Limpiamos filas anteriores para evitar duplicados visuales
            cuerpo.innerHTML = "";

            // Manejo visual si no hay datos
            if (listaPrestamos.length === 0) {
                mensajeVacio.classList.remove("hidden");
                contador.textContent = "0 Registros";
                return;
            } else {
                mensajeVacio.classList.add("hidden");
                contador.textContent = `${listaPrestamos.length} Registros`;
            }

            // Recorremos cada préstamo para construir las filas de la tabla
            listaPrestamos.forEach((prestamo) => {
                const fila = document.createElement("tr");
                fila.className = "border-b hover:bg-gray-50 text-gray-900";

                // Definimos el color de la etiqueta según el estado de pago (Verde = Pagado, Rojo = Pendiente)
                const colorEstado = prestamo.estado === "Pagado" 
                    ? "bg-green-100 text-green-800" 
                    : "bg-red-100 text-red-800";

                // Inyectamos la estructura HTML de la fila de forma segura
                fila.innerHTML = `
                    <td class="px-4 py-3 text-xs text-gray-500">${prestamo.fecha}</td>
                    <td class="px-4 py-3 font-medium">${prestamo.cliente}</td>
                    <td class="px-4 py-3">${prestamo.equipo}</td>
                    <td class="px-4 py-3 font-semibold">$${prestamo.monto}</td>
                    <td class="px-4 py-3">
                        <span class="px-2 py-1 rounded-full text-xs font-semibold ${colorEstado}">
                            ${prestamo.estado}
                        </span>
                    </td>
                    <td class="px-4 py-3 text-right space-x-2">
                        <button onclick="cambiarEstado(${prestamo.id})" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 py-1 px-2 rounded border border-gray-300 transition">
                            Cambiar Estado
                        </button>
                        <button onclick="eliminarPrestamo(${prestamo.id})" class="text-xs bg-red-50 hover:bg-red-100 text-red-600 py-1 px-2 rounded transition">
                            Borrar
                        </button>
                    </td>
                `;
                cuerpo.appendChild(fila);
            });
        }

        // Función de negocio para alternar el estado de pago rápidamente al hacer clic en un botón
        function cambiarEstado(id) {
            listaPrestamos = listaPrestamos.map((p) => {
                if (p.id === id) {
                    p.estado = p.estado === "Pendiente" ? "Pagado" : "Pendiente";
                }
                return p;
            });
            guardarEnAlmacenamiento();
            actualizarTabla();
        }

        // Función para eliminar un registro erróneo o un préstamo completamente archivado
        function eliminarPrestamo(id) {
            if (confirm("¿Estás seguro de que deseas eliminar este respaldo de préstamo?")) {
                listaPrestamos = listaPrestamos.filter((p) => p.id !== id);
                guardarEnAlmacenamiento();
                actualizarTabla();
            }
        }
    </script>
</body>
</html>
