<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión - Tienda de Celulares</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-900">

    <header class="bg-slate-900 text-white p-4 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-blue-400">HARVARD TECH MOBILES</h1>
                <p class="text-xs text-gray-400 font-mono">Enterprise Resource Planning (ERP) v3.0</p>
            </div>
            <nav class="flex space-x-2">
                <button onclick="cambiarPestana('vendedor')" id="btn-vendedor" class="px-4 py-2 rounded text-sm font-bold bg-blue-600 text-white shadow">
                    🛒 Vista Vendedor
                </button>
                <button onclick="cambiarPestana('dueno')" id="btn-dueno" class="px-4 py-2 rounded text-sm font-bold bg-slate-800 text-gray-300 hover:bg-slate-700">
                    🔑 Vista Dueño (Privado)
                </button>
                <button onclick="cambiarPestana('reportes')" id="btn-reportes" class="px-4 py-2 rounded text-sm font-bold bg-slate-800 text-gray-300 hover:bg-slate-700">
                    📊 Reportes Protegidos
                </button>
            </nav>
        </div>
    </header>

    <main class="container mx-auto p-6 max-w-5xl">

        <section id="seccion-vendedor" class="space-y-6">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center">
                    <span class="mr-2">🛍️</span> Registrar Nueva Venta
                </h2>
                
                <form onsubmit="registrarVenta(event)" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Tu Nombre (Vendedor)</label>
                            <input type="text" id="ventaVendedor" required placeholder="Ej: Carlos Mendoza" class="w-full p-2.5 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Modelo de Celular</label>
                            <select id="ventaModelo" class="w-full p-2.5 border border-gray-300 rounded bg-white focus:ring-2 focus:ring-blue-500" onchange="forzarAutofillYRecalcular()">
                                </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Tipo de Venta</label>
                            <select id="ventaTipo" class="w-full p-2.5 border border-gray-300 rounded bg-white focus:ring-2 focus:ring-blue-500" onchange="forzarAutofillYRecalcular()">
                                <option value="Unidad">Venta por Unidad (Minorista)</option>
                                <option value="Mayor">Venta por Mayor (Volumen)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Cantidad Vendida</label>
                            <input type="number" id="ventaCantidad" value="1" min="1" required class="w-full p-2.5 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500" oninput="actualizarPreciosVenta(false)">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Tipo de Cambio del Día</label>
                            <input type="number" id="ventaTipoCambio" value="6.96" step="0.01" required class="w-full p-2.5 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500" oninput="actualizarPreciosVenta(false)">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Precio Cobrado por Unidad (Editable)</label>
                            <input type="number" id="ventaPrecioCobrado" required class="w-full p-2.5 border border-blue-400 bg-blue-50/50 rounded font-bold focus:ring-2 focus:ring-blue-500" oninput="actualizarPreciosVenta(true)">
                            <p class="text-[10px] text-blue-600 mt-1">Sugerido automático aplicado. Puedes modificarlo.</p>
                        </div>
                    </div>

                    <div class="bg-slate-50 p-4 rounded-lg border border-slate-200 grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <span class="text-xs font-bold text-slate-500 uppercase block">Total Neto de la Operación:</span>
                            <span id="txtTotalCobrar" class="text-xl font-extrabold text-slate-900">0.00</span>
                        </div>
                        <div>
                            <span class="text-xs font-bold text-emerald-600 uppercase block">Tu Comisión por esta Venta:</span>
                            <span id="txtComisionVendedor" class="text-xl font-extrabold text-emerald-600">0.00</span>
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-blue-600 text-white p-3 rounded-lg font-bold hover:bg-blue-700 transition shadow cursor-pointer">
                        💸 Registrar y Confirmar Venta
                    </button>
                </form>
            </div>
        </section>

        <section id="seccion-dueno" class="hidden space-y-6">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-red-200">
                <h2 class="text-xl font-bold text-red-900 mb-4 flex items-center">
